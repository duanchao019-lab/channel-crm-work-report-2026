<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="description" content="美豆科技渠道客户管理系统近期开发技术复盘思维导图：开发思路诊断、核心技术卡点、推进阻力与后续解决周期。">
<title>渠道近期开发技术复盘｜思维导图</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0A111E;
  --surface:#111B2E;
  --surface-2:#16233A;
  --panel:rgba(15,24,41,.94);
  --line:rgba(148,176,210,.22);
  --line-strong:rgba(148,176,210,.42);
  --ink:#F3F7FC;
  --muted:#B5C6DC;
  --dim:#7F95B2;
  --c-root:#818CF8;
  --c-teal:#2DD4BF;
  --c-amber:#F59E0B;
  --c-rose:#FB7185;
  --c-gold:#FACC15;
  --c-sky:#38BDF8;
  --font-sans:"PingFang SC","Microsoft YaHei","Segoe UI","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:var(--ink)}
button{
  background:rgba(24,38,62,.88);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;min-height:34px;font-size:12.5px;line-height:1.2;cursor:pointer;
  transition:background .16s,border-color .16s,color .16s;white-space:nowrap;
}
button:hover{background:rgba(36,56,90,.96);border-color:var(--line-strong)}
button:focus-visible,input:focus-visible{outline:2px solid var(--c-sky);outline-offset:2px}
button.active{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.62);color:#E0F2FE;font-weight:600}

.app{
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) 44px;
  width:100%;height:100vh;height:100dvh;overflow:hidden;
}

/* Header */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;background:rgba(12,20,35,.95);border-bottom:1px solid var(--line);z-index:20;
  min-width:0;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand-badge{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(45,212,191,.22),rgba(56,189,248,.22));
  border:1px solid rgba(56,189,248,.48);display:grid;place-items:center;
  font-family:var(--font-mono);font-size:13px;font-weight:800;color:#7DD3FC;
}
.brand-title strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-title small{display:block;font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap}

.toolbar-mid{display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:rgba(9,15,27,.8);border:1px solid var(--line)}
.seg button{border:0;background:transparent;min-height:28px;padding:4px 11px;border-radius:7px;color:var(--muted)}
.seg button.active{background:rgba(56,189,248,.2);color:#F0F9FF}

.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap input{
  width:185px;height:32px;padding:0 28px 0 10px;border-radius:8px;
  border:1px solid var(--line);background:rgba(9,15,27,.85);font-size:12.5px;
}
.search-wrap input::placeholder{color:var(--dim)}
.search-clear{
  position:absolute;right:4px;min-height:22px;padding:0 6px;border:0;background:transparent;
  color:var(--dim);font-size:14px;display:none;
}
.search-clear.show{display:inline-flex;align-items:center}

.toolbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.zoom-readout{
  font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center;
  font-variant-numeric:tabular-nums;
}

/* Main Workspace */
.workspace{position:relative;min-height:0;overflow:hidden;width:100%}

/* Mindmap Canvas */
.canvas-view{
  position:absolute;inset:0;overflow:hidden;cursor:grab;user-select:none;
  background-color:var(--bg);
  background-image:
    radial-gradient(rgba(148,176,210,.16) 1px,transparent 1px),
    radial-gradient(ellipse 60% 45% at 85% 15%,rgba(56,189,248,.07),transparent 65%),
    radial-gradient(ellipse 50% 45% at 12% 85%,rgba(45,212,191,.07),transparent 65%);
  background-size:26px 26px,100% 100%,100% 100%;
  touch-action:none;
}
.canvas-view.dragging{cursor:grabbing}
.world{
  position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
}
.edges-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge-path{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.72;transition:opacity .18s,stroke-width .18s}
.edge-path.hl{opacity:1;stroke-width:3.2;filter:drop-shadow(0 0 6px currentColor)}
.edge-path.dim{opacity:.16}

.nodes-layer{position:absolute;left:0;top:0}
.node{
  position:absolute;border-radius:11px;background:var(--surface);
  border:1px solid var(--line);padding:9px 13px;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.32);
  transition:border-color .16s,box-shadow .16s,opacity .16s,transform .16s;
  display:flex;flex-direction:column;gap:4px;
}
.node:hover{border-color:var(--line-strong);box-shadow:0 10px 26px rgba(0,0,0,.46)}
.node.selected{
  box-shadow:0 0 0 2px var(--node-color,#38BDF8),0 12px 28px rgba(0,0,0,.55);
  border-color:var(--node-color,#38BDF8);
  background:var(--surface-2);
}
.node.dim{opacity:.24}
.node.match{box-shadow:0 0 0 2px #FACC15,0 0 18px rgba(250,204,21,.45)}

.node.depth-0{
  width:214px;padding:15px 16px;border-radius:15px;text-align:center;
  background:linear-gradient(145deg,#1D2F52,#101B30);
  border:1.5px solid rgba(129,140,248,.72);
  box-shadow:0 0 40px rgba(99,102,241,.24),0 14px 32px rgba(0,0,0,.48);
}
.node.depth-0 .node-title{font-size:16.5px;font-weight:800;line-height:1.35;color:#fff}
.node.depth-0 .node-sub{font-size:11.5px;color:#A5B4FC;margin-top:4px;line-height:1.4}

.node.depth-1{
  width:210px;padding:9px 12px;border-left:4px solid var(--node-color);
  background:linear-gradient(135deg,rgba(22,36,60,.96),rgba(15,25,43,.95));
}
.node.depth-1.side-left{border-left:1px solid var(--line);border-right:4px solid var(--node-color)}
.node.depth-1 .node-title{font-size:13.5px;font-weight:700;line-height:1.32;color:#F8FAFC}
.node.depth-1 .node-sub{font-size:11px;color:var(--muted);line-height:1.38}

.node.depth-2{
  width:274px;padding:7px 12px;border-left:3px solid var(--node-color);gap:2px;
}
.node.depth-2.side-left{border-left:1px solid var(--line);border-right:3px solid var(--node-color)}
.node.depth-2 .node-title{font-size:12.5px;font-weight:600;line-height:1.34;color:#EEF4FB}
.node.depth-2 .node-sub{font-size:11px;color:var(--dim);line-height:1.34;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.node.depth-3{
  width:288px;padding:7px 12px;border-radius:9px;gap:2px;
  background:rgba(15,24,42,.94);border-left:2px solid var(--node-color);
}
.node.depth-3.side-left{border-left:1px solid var(--line);border-right:2px solid var(--node-color)}
.node.depth-3 .node-title{font-size:12px;font-weight:600;line-height:1.36;color:#E2ECF7}
.node.depth-3 .node-sub{font-size:11px;color:var(--muted);line-height:1.38}

.node-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.node-tag{
  display:inline-flex;align-items:center;padding:1px 6px;border-radius:4px;
  font-size:10px;font-weight:700;letter-spacing:.2px;flex-shrink:0;
  background:rgba(255,255,255,.07);color:var(--node-color);
  border:1px solid rgba(255,255,255,.12);
}
.node-tag.ok{color:#5EEAD4;background:rgba(45,212,191,.14);border-color:rgba(45,212,191,.35)}
.node-tag.warn{color:#FCD34D;background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.36)}
.node-tag.risk{color:#FDA4AF;background:rgba(251,113,133,.15);border-color:rgba(251,113,133,.36)}
.node-tag.info{color:#7DD3FC;background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.35)}

.toggle-btn{
  position:absolute;right:-24px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;min-height:22px;padding:0;border-radius:999px;
  background:#0F1A2E;border:1.5px solid var(--node-color);color:var(--node-color);
  font-family:var(--font-mono);font-size:10px;font-weight:700;
  display:grid;place-items:center;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.45);
}
.node.side-left .toggle-btn{right:auto;left:-24px}
.toggle-btn:hover{background:var(--node-color);color:#09111E}

/* Right Detail Drawer */
.drawer{
  position:absolute;top:12px;right:12px;bottom:12px;width:min(390px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;z-index:15;
  transform:translateX(calc(100% + 20px));transition:transform .22s ease;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:15px 16px 12px;border-bottom:1px solid var(--line);
}
.drawer-path{font-size:11.5px;color:var(--dim);margin-bottom:5px;line-height:1.4}
.drawer-title{font-size:16px;font-weight:700;line-height:1.35;color:#fff;margin:0}
.drawer-close{min-height:28px;padding:3px 9px;font-size:12px;flex-shrink:0}
.drawer-body{
  padding:14px 16px 18px;overflow-y:auto;display:grid;gap:12px;align-content:start;
  scrollbar-width:thin;scrollbar-color:rgba(148,176,210,.28) transparent;
}
.detail-block{
  padding:11px 13px;border-radius:10px;background:rgba(10,17,30,.72);
  border:1px solid var(--line);display:grid;gap:6px;
}
.detail-block h4{
  margin:0;font-size:11.5px;letter-spacing:.8px;color:var(--c-sky);text-transform:uppercase;
}
.detail-block.warn h4{color:var(--c-amber)}
.detail-block.risk h4{color:var(--c-rose)}
.detail-block.ok h4{color:var(--c-teal)}
.detail-block p{margin:0;font-size:13px;line-height:1.62;color:var(--muted)}
.detail-list{margin:0;padding-left:16px;display:grid;gap:5px;font-size:12.8px;line-height:1.58;color:var(--muted)}
.detail-list strong{color:var(--ink)}
.child-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.child-pill{
  font-size:12px;padding:4px 9px;border-radius:6px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:left;white-space:normal;
}
.child-pill:hover{border-color:var(--c-sky);background:rgba(56,189,248,.12)}

/* Outline View (Alternative readable mode & Mobile friendly) */
.outline-view{
  position:absolute;inset:0;overflow-y:auto;padding:22px clamp(16px,4vw,48px) 36px;
  background:var(--bg);display:none;
}
.outline-view.show{display:block}
.outline-wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.outline-hero{
  padding:18px 22px;border-radius:14px;background:linear-gradient(135deg,#172642,#101B2E);
  border:1px solid rgba(129,140,248,.48);display:grid;gap:6px;
}
.outline-hero h2{margin:0;font-size:22px;color:#fff}
.outline-hero p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.outline-branch{
  border-radius:14px;background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--b-color);padding:16px 18px;display:grid;gap:12px;
}
.outline-branch-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.outline-branch-head h3{margin:0;font-size:17px;color:#fff}
.outline-branch-head span{font-size:12.5px;color:var(--muted)}
.outline-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.outline-card{
  padding:12px 14px;border-radius:10px;background:rgba(10,17,30,.75);
  border:1px solid var(--line);display:grid;gap:7px;align-content:start;
}
.outline-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.outline-card-head strong{font-size:14px;color:var(--ink);line-height:1.4}
.outline-card p{margin:0;font-size:13px;line-height:1.58;color:var(--muted)}
.outline-sublist{margin:0;padding-left:16px;display:grid;gap:4px;font-size:12.5px;line-height:1.52;color:#C8D7E8}

/* Bottom Bar */
.footbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 16px;background:rgba(12,20,35,.96);border-top:1px solid var(--line);z-index:20;
  overflow-x:auto;scrollbar-width:none;
}
.footbar::-webkit-scrollbar{display:none}
.branch-jumps{display:flex;align-items:center;gap:6px;flex-shrink:0}
.jump-pill{
  display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;
  border-radius:999px;font-size:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);
}
.jump-pill i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--dot)}
.jump-pill:hover{border-color:var(--dot);color:#fff}
.foot-hint{font-size:11.5px;color:var(--dim);white-space:nowrap;flex-shrink:0}

/* Mobile Responsive */
@media (max-width:960px){
  .app{grid-template-rows:auto minmax(0,1fr) 44px}
  .topbar{padding:8px 12px;flex-wrap:wrap;gap:8px}
  .brand-title small,.foot-hint,#btn-full,.zoom-readout{display:none}
  .search-wrap input{width:136px}
  .toolbar-right button{padding:5px 8px;font-size:12px;min-height:30px}
  .outline-cards{grid-template-columns:1fr}
  .drawer{
    top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:58vh;
    transform:translateY(calc(100% + 20px));
  }
  .drawer.open{transform:translateY(0)}
}

@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#111}
  .topbar,.footbar,.canvas-view,.drawer{display:none!important}
  .app,.workspace{display:block;height:auto;overflow:visible}
  .outline-view{display:block!important;position:static;overflow:visible;background:#fff;padding:10mm}
  .outline-hero,.outline-branch,.outline-card{
    background:#F8FAFC!important;color:#111!important;border-color:#CBD5E1!important;break-inside:avoid;
  }
  .outline-hero h2,.outline-branch-head h3,.outline-card-head strong{color:#0F172A!important}
  .outline-hero p,.outline-card p,.outline-sublist,.outline-branch-head span{color:#334155!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">DEV</div>
      <div class="brand-title">
        <strong>渠道近期开发技术复盘 · 思维导图</strong>
        <small>开发思路诊断 · 核心技术卡点 · 推进阻力 · 解决周期（2026-11-27）</small>
      </div>
    </div>

    <div class="toolbar-mid">
      <div class="seg" role="tablist" aria-label="视图切换">
        <button id="tab-map" class="active" type="button" role="tab" aria-selected="true">思维导图</button>
        <button id="tab-outline" type="button" role="tab" aria-selected="false">大纲清单</button>
      </div>
      <div class="search-wrap">
        <input id="search-input" type="search" placeholder="搜索 PR / 卡点 / 周期..." aria-label="搜索思维导图节点">
        <button id="search-clear" class="search-clear" type="button" aria-label="清除搜索">×</button>
      </div>
    </div>

    <div class="toolbar-right" id="map-controls">
      <button id="btn-standard" type="button" title="展开到二级重点（推荐开会视图）">标准视图</button>
      <button id="btn-expand-all" type="button" title="展开全部三级技术细项">展开全部</button>
      <button id="btn-collapse" type="button" title="收起到五大主干">只看主干</button>
      <button id="btn-fit" type="button" title="自动居中缩放适应窗口">适应画面</button>
      <button id="btn-zoom-out" type="button" aria-label="缩小">−</button>
      <span class="zoom-readout" id="zoom-readout">100%</span>
      <button id="btn-zoom-in" type="button" aria-label="放大">+</button>
      <button id="btn-full" type="button">全屏</button>
    </div>
  </header>

  <main class="workspace">
    <section class="canvas-view" id="canvas-view" aria-label="交互式思维导图画布">
      <div class="world" id="world">
        <svg class="edges-svg" id="edges-svg"></svg>
        <div class="nodes-layer" id="nodes-layer"></div>
      </div>

      <aside class="drawer" id="drawer" aria-label="节点技术详情">
        <div class="drawer-head">
          <div>
            <div class="drawer-path" id="drawer-path"></div>
            <h3 class="drawer-title" id="drawer-title"></h3>
          </div>
          <button class="drawer-close" id="drawer-close" type="button">关闭</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </section>

    <section class="outline-view" id="outline-view" aria-label="技术复盘结构化大纲">
      <div class="outline-wrap" id="outline-wrap"></div>
    </section>
  </main>

  <footer class="footbar">
    <div class="branch-jumps" id="branch-jumps"></div>
    <span class="foot-hint">滚轮缩放 · 拖拽画布 · 点击节点查看技术研判 · 点击节点右侧 +/− 展开细节</span>
  </footer>
</div>

  // State
  const nodeById = new Map();
  const parentById = new Map();
  const collapsed = new Set();

  const LEFT_BRANCH_IDS = new Set(['b-thinking', 'b-tech-blockers']);

  function indexTree(node, parent = null, inheritedColor = null, inheritedSide = 'center') {
    node._color = node.color || inheritedColor || '#38BDF8';
    node._depth = parent ? parent._depth + 1 : 0;
    if (node._depth === 0) node._side = 'center';
    else if (node._depth === 1) node._side = LEFT_BRANCH_IDS.has(node.id) ? 'left' : 'right';
    else node._side = inheritedSide;

    nodeById.set(node.id, node);
    if (parent) parentById.set(node.id, parent);
    if (node._depth >= 2 && node.children && node.children.length > 0) {
      collapsed.add(node.id);
    }
    if (node.children) {
      node.children.forEach((c) => indexTree(c, node, node._color, node._side));
    }
  }

  function getAncestors(id) {
    const set = new Set();
    let cur = id;
    while (cur) {
      set.add(cur);
      const p = parentById.get(cur);
      cur = p ? p.id : null;
    }
    return set;
  }

  function getPathTitles(id) {
    const arr = [];
    let cur = nodeById.get(id);
    while (cur) {
      arr.unshift(cur.title);
      cur = parentById.get(cur.id);
    }
    return arr;
  }

  function matchesSearch(node, q) {
    if (!q) return false;
    const hay = [
      node.title,
      node.sub || '',
      node.tag || '',
      node.detail?.summary || '',
      (node.detail?.evidence || []).join(' '),
      node.detail?.action || ''
    ].join(' ').toLowerCase();
    return hay.includes(q);
  }

  function countDescendants(node) {
    if (!node.children || !node.children.length) return 0;
    return node.children.length;
  }

  function getVisibleNodes() {
    const list = [];
    function walk(node) {
      list.push(node);
      if (node.children && node.children.length && !collapsed.has(node.id)) {
        node.children.forEach(walk);
      }
    }
    walk(TREE);
    return list;
  }

  function applyTransform() {
    world.style.transform = `translate(${viewState.x}px, ${viewState.y}px) scale(${viewState.scale})`;
    zoomReadout.textContent = Math.round(viewState.scale * 100) + '%';
  }

  function renderMap() {
    const visible = getVisibleNodes();
    nodesLayer.innerHTML = '';
    const elMap = new Map();

    // 1. Mount elements to measure exact natural heights
    visible.forEach((node) => {
      const el = document.createElement('div');
      el.className = `node depth-${Math.min(node._depth, 3)} side-${node._side}`;
      el.dataset.id = node.id;
      el.style.setProperty('--node-color', node._color);

      const topHtml = node.tag
        ? `<div class="node-top"><span class="node-title"></span><span class="node-tag ${node.tagType || ''}"></span></div>`
        : `<div class="node-title"></div>`;
      el.innerHTML = topHtml + (node.sub ? `<div class="node-sub"></div>` : '');
      el.querySelector('.node-title').textContent = node.title;
      if (node.tag) el.querySelector('.node-tag').textContent = node.tag;
      if (node.sub) el.querySelector('.node-sub').textContent = node.sub;

      if (node.children && node.children.length > 0 && node._depth > 0) {
        const isCol = collapsed.has(node.id);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toggle-btn';
        btn.title = isCol ? '展开子节点' : '折叠子节点';
        btn.textContent = isCol ? '+' + countDescendants(node) : '−';
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (collapsed.has(node.id)) collapsed.delete(node.id);
          else collapsed.add(node.id);
          renderMap();
        });
        el.appendChild(btn);
      }

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectNode(node.id, false);
      });

      nodesLayer.appendChild(el);
      elMap.set(node.id, el);
    });

    // 2. Measure sizes
    const sizeMap = new Map();
    visible.forEach((node) => {
      const el = elMap.get(node.id);
      sizeMap.set(node.id, { w: el.offsetWidth, h: el.offsetHeight });
    });

    // 3. Balanced Left + Right radial XMind tree layout
    const GAP_X = 56;
    const ROOT_GAP_X = 60;
    const GAP_Y = 8;
    const BRANCH_GAP_Y = 20;
    const subHeight = new Map();

    function calcHeight(node) {
      const { h } = sizeMap.get(node.id);
      if (!node.children || !node.children.length || collapsed.has(node.id)) {
        subHeight.set(node.id, h);
        return h;
      }
      let total = 0;
      node.children.forEach((c, idx) => {
        total += calcHeight(c);
        if (idx > 0) total += GAP_Y;
      });
      const res = Math.max(h, total);
      subHeight.set(node.id, res);
      return res;
    }

    const leftBranches = (TREE.children || []).filter((c) => c._side === 'left');
    const rightBranches = (TREE.children || []).filter((c) => c._side === 'right');

    const leftTotalH = leftBranches.reduce((acc, b, i) => acc + calcHeight(b) + (i > 0 ? BRANCH_GAP_Y : 0), 0);
    const rightTotalH = rightBranches.reduce((acc, b, i) => acc + calcHeight(b) + (i > 0 ? BRANCH_GAP_Y : 0), 0);
    const rootSize = sizeMap.get(TREE.id);
    const totalH = Math.max(rootSize.h, leftTotalH, rightTotalH);

    // Compute max left depth width so root sits cleanly with positive coordinates
    function calcSideWidth(node) {
      const { w } = sizeMap.get(node.id);
      if (!node.children || !node.children.length || collapsed.has(node.id)) return w;
      const maxChildW = Math.max(...node.children.map(calcSideWidth));
      return w + GAP_X + maxChildW;
    }
    const maxLeftW = leftBranches.length ? Math.max(...leftBranches.map(calcSideWidth)) : 0;
    const PAD = 36;
    const rootX = PAD + maxLeftW + (leftBranches.length ? ROOT_GAP_X : 0);
    const rootY = PAD + (totalH - rootSize.h) / 2;

    nodeRects = new Map();
    nodeRects.set(TREE.id, { x: rootX, y: rootY, w: rootSize.w, h: rootSize.h });

    function assignRight(node, x, topY) {
      const { w, h } = sizeMap.get(node.id);
      const sh = subHeight.get(node.id);
      const y = topY + (sh - h) / 2;
      nodeRects.set(node.id, { x, y, w, h });
      if (node.children && node.children.length && !collapsed.has(node.id)) {
        const childrenSum = node.children.reduce((acc, c, i) => acc + subHeight.get(c.id) + (i > 0 ? GAP_Y : 0), 0);
        let cy = topY + (sh - childrenSum) / 2;
        const cx = x + w + GAP_X;
        node.children.forEach((c) => {
          assignRight(c, cx, cy);
          cy += subHeight.get(c.id) + GAP_Y;
        });
      }
    }

    function assignLeft(node, rightEdgeX, topY) {
      const { w, h } = sizeMap.get(node.id);
      const sh = subHeight.get(node.id);
      const x = rightEdgeX - w;
      const y = topY + (sh - h) / 2;
      nodeRects.set(node.id, { x, y, w, h });
      if (node.children && node.children.length && !collapsed.has(node.id)) {
        const childrenSum = node.children.reduce((acc, c, i) => acc + subHeight.get(c.id) + (i > 0 ? GAP_Y : 0), 0);
        let cy = topY + (sh - childrenSum) / 2;
        const childRightX = x - GAP_X;
        node.children.forEach((c) => {
          assignLeft(c, childRightX, cy);
          cy += subHeight.get(c.id) + GAP_Y;
        });
      }
    }

    let ly = PAD + (totalH - leftTotalH) / 2;
    leftBranches.forEach((b) => {
      assignLeft(b, rootX - ROOT_GAP_X, ly);
      ly += subHeight.get(b.id) + BRANCH_GAP_Y;
    });

    let ry = PAD + (totalH - rightTotalH) / 2;
    rightBranches.forEach((b) => {
      assignRight(b, rootX + rootSize.w + ROOT_GAP_X, ry);
      ry += subHeight.get(b.id) + BRANCH_GAP_Y;
    });

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodeRects.forEach((r) => {
      minX = Math.min(minX, r.x);
      minY = Math.min(minY, r.y);
      maxX = Math.max(maxX, r.x + r.w);
      maxY = Math.max(maxY, r.y + r.h);
    });
    layoutBounds = { minX: minX - 18, minY: minY - 18, maxX: maxX + 18, maxY: maxY + 18 };

    // 4. Position elements & draw SVG Bézier curves
    const q = searchQuery.trim().toLowerCase();
    const matchedIds = new Set();
    if (q) {
      visible.forEach((n) => {
        if (matchesSearch(n, q)) matchedIds.add(n.id);
      });
    }
    const activeChain = selectedId ? getAncestors(selectedId) : null;

    edgesSvg.setAttribute('width', String(Math.ceil(layoutBounds.maxX + 80)));
    edgesSvg.setAttribute('height', String(Math.ceil(layoutBounds.maxY + 80)));
    edgesSvg.innerHTML = '';

    visible.forEach((node) => {
      const r = nodeRects.get(node.id);
      const el = elMap.get(node.id);
      el.style.left = r.x + 'px';
      el.style.top = r.y + 'px';

      el.classList.toggle('selected', node.id === selectedId);
      el.classList.toggle('match', matchedIds.has(node.id));
      if (q && matchedIds.size > 0) {
        el.classList.toggle('dim', !matchedIds.has(node.id));
      } else {
        el.classList.remove('dim');
      }

      const parent = parentById.get(node.id);
      if (parent && nodeRects.has(parent.id)) {
        const pr = nodeRects.get(parent.id);
        const isLeft = node._side === 'left';
        const x1 = isLeft ? pr.x : pr.x + pr.w;
        const y1 = pr.y + pr.h / 2;
        const x2 = isLeft ? r.x + r.w : r.x;
        const y2 = r.y + r.h / 2;
        const cx = (x1 + x2) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
        path.setAttribute('stroke', node._color);
        let cls = 'edge-path';
        if (activeChain && activeChain.has(node.id) && activeChain.has(parent.id)) cls += ' hl';
        else if (q && matchedIds.size > 0 && !matchedIds.has(node.id)) cls += ' dim';
        path.setAttribute('class', cls);
        edgesSvg.appendChild(path);
      }
    });
  }

  function fitToView(targetRects = null, maxScale = 1.05) {
    const cw = canvasView.clientWidth;
    const ch = canvasView.clientHeight;
    if (!cw || !ch) return;
    const drawerPad = drawer.classList.contains('open') && cw > 960 ? 404 : 0;
    const availW = Math.max(260, cw - drawerPad - 48);
    const availH = Math.max(240, ch - 48);

    let b = layoutBounds;
    if (targetRects && targetRects.length) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      targetRects.forEach((r) => {
        minX = Math.min(minX, r.x);
        minY = Math.min(minY, r.y);
        maxX = Math.max(maxX, r.x + r.w);
        maxY = Math.max(maxY, r.y + r.h);
      });
      b = { minX, minY, maxX: maxX + 20, maxY: maxY + 20 };
    }

    const bw = Math.max(100, b.maxX - b.minX);
    const bh = Math.max(100, b.maxY - b.minY);
    const scale = Math.max(0.32, Math.min(maxScale, availW / bw, availH / bh));
    viewState.scale = scale;
    viewState.x = 24 + (availW - bw * scale) / 2 - b.minX * scale;
    viewState.y = 24 + (availH - bh * scale) / 2 - b.minY * scale;
    applyTransform();
  }

  function focusSubtree(branchId) {
    const branch = nodeById.get(branchId);
    if (!branch) return;
    // Expand branch & its direct children so details are immediately visible
    collapsed.delete(branchId);
    if (branch.children) {
      branch.children.forEach((c) => collapsed.delete(c.id));
    }
    renderMap();
    const rects = [];
    function collect(n) {
      if (nodeRects.has(n.id)) rects.push(nodeRects.get(n.id));
      if (n.children && !collapsed.has(n.id)) n.children.forEach(collect);
    }
    collect(branch);
    selectNode(branchId, true);
    fitToView(rects, 1.0);
  }

  function openDrawer(node) {
    drawerPath.textContent = getPathTitles(node.id).join('  ›  ');
    drawerTitle.textContent = node.title;
    drawerBody.innerHTML = '';

    const d = node.detail;
    if (d && d.summary) {
      const b1 = document.createElement('div');
      b1.className = 'detail-block';
      b1.innerHTML = `<h4>核心判断</h4><p></p>`;
      b1.querySelector('p').textContent = d.summary;
      drawerBody.appendChild(b1);
    } else if (node.sub) {
      const b1 = document.createElement('div');
      b1.className = 'detail-block';
      b1.innerHTML = `<h4>要点说明</h4><p></p>`;
      b1.querySelector('p').textContent = node.sub;
      drawerBody.appendChild(b1);
    }

    if (d && d.evidence && d.evidence.length) {
      const b2 = document.createElement('div');
      b2.className = 'detail-block warn';
      b2.innerHTML = `<h4>现状事实与技术证据</h4><ul class="detail-list"></ul>`;
      const ul = b2.querySelector('ul');
      d.evidence.forEach((item) => {
        const li = document.createElement('li');
        li.innerHTML = item;
        ul.appendChild(li);
      });
      drawerBody.appendChild(b2);
    }

    if (d && d.action) {
      const b3 = document.createElement('div');
      b3.className = 'detail-block ok';
      b3.innerHTML = `<h4>解决思路与落地建议</h4><p></p>`;
      b3.querySelector('p').innerHTML = d.action;
      drawerBody.appendChild(b3);
    }

    if (node.children && node.children.length) {
      const b4 = document.createElement('div');
      b4.className = 'detail-block';
      b4.innerHTML = `<h4>包含子项（点击快速定位）</h4><div class="child-pills"></div>`;
      const wrap = b4.querySelector('.child-pills');
      node.children.forEach((c) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'child-pill';
        btn.textContent = c.title;
        btn.onclick = () => {
          collapsed.delete(node.id);
          renderMap();
          selectNode(c.id, true);
          const r = nodeRects.get(c.id);
          if (r) fitToView([r], 1.05);
        };
        wrap.appendChild(btn);
      });
      drawerBody.appendChild(b4);
    }

    drawer.classList.add('open');
  }

  function selectNode(id, skipRerender = false) {
    selectedId = id;
    const node = nodeById.get(id);
    if (node) openDrawer(node);
    if (!skipRerender) renderMap();
  }

  function renderOutline() {
    outlineWrap.innerHTML = '';
    const hero = document.createElement('div');
    hero.className = 'outline-hero';
    hero.innerHTML = `<h2>${TREE.title}</h2><p>${TREE.detail.summary}</p>`;
    outlineWrap.appendChild(hero);

    TREE.children.forEach((branch) => {
      const sec = document.createElement('section');
      sec.className = 'outline-branch';
      sec.style.setProperty('--b-color', branch._color);
      sec.innerHTML = `
        <div class="outline-branch-head">
          <h3>${branch.title}</h3>
          <span>${branch.sub || ''}</span>
        </div>
        <div class="outline-cards"></div>
      `;
      const grid = sec.querySelector('.outline-cards');
      (branch.children || []).forEach((item) => {
        const card = document.createElement('article');
        card.className = 'outline-card';
        const tagHtml = item.tag ? `<span class="node-tag ${item.tagType || ''}">${item.tag}</span>` : '';
        let html = `<div class="outline-card-head"><strong>${item.title}</strong>${tagHtml}</div>`;
        if (item.detail?.summary) html += `<p>${item.detail.summary}</p>`;
        else if (item.sub) html += `<p>${item.sub}</p>`;

        if (item.detail?.evidence?.length) {
          html += `<ul class="outline-sublist">${item.detail.evidence.map((e) => `<li>${e}</li>`).join('')}</ul>`;
        } else if (item.children?.length) {
          html += `<ul class="outline-sublist">${item.children.map((c) => `<li><strong>${c.title}</strong>：${c.sub || ''}</li>`).join('')}</ul>`;
        }
        if (item.detail?.action) {
          html += `<p style="color:#7DD3FC"><strong>应对：</strong>${item.detail.action}</p>`;
        }
        card.innerHTML = html;
        grid.appendChild(card);
      });
      outlineWrap.appendChild(sec);
    });
  }

  function buildJumpPills() {
    branchJumps.innerHTML = '';
    TREE.children.forEach((b) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'jump-pill';
      btn.style.setProperty('--dot', b._color);
      btn.innerHTML = `<i></i><span></span>`;
      btn.querySelector('span').textContent = b.title.replace(/（.*?）/g, '');
      btn.onclick = () => {
        if (outlineView.classList.contains('show')) switchView('map');
        focusSubtree(b.id);
      };
      branchJumps.appendChild(btn);
    });
  }

  function switchView(mode) {
    const isMap = mode === 'map';
    tabMap.classList.toggle('active', isMap);
    tabMap.setAttribute('aria-selected', String(isMap));
    tabOutline.classList.toggle('active', !isMap);
    tabOutline.setAttribute('aria-selected', String(!isMap));
    outlineView.classList.toggle('show', !isMap);
    mapControls.style.visibility = isMap ? 'visible' : 'hidden';
    if (isMap) {
      requestAnimationFrame(() => fitToView());
    }
  }

  // Pan & Zoom interactions
  let dragging = false;
  let dragStart = { x: 0, y: 0, vx: 0, vy: 0 };

  canvasView.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.node') || e.target.closest('.drawer')) return;
    dragging = true;
    canvasView.classList.add('dragging');
    dragStart = { x: e.clientX, y: e.clientY, vx: viewState.x, vy: viewState.y };
    canvasView.setPointerCapture(e.pointerId);
  });

  canvasView.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    viewState.x = dragStart.vx + (e.clientX - dragStart.x);
    viewState.y = dragStart.vy + (e.clientY - dragStart.y);
    applyTransform();
  });

  const endDrag = () => {
    dragging = false;
    canvasView.classList.remove('dragging');
  };
  canvasView.addEventListener('pointerup', endDrag);
  canvasView.addEventListener('pointercancel', endDrag);

  canvasView.addEventListener('click', (e) => {
    if (!e.target.closest('.node') && !e.target.closest('.drawer')) {
      drawer.classList.remove('open');
      selectedId = null;
      renderMap();
    }
  });

  function zoomAt(factor, clientX, clientY) {
    const rect = canvasView.getBoundingClientRect();
    const px = clientX - rect.left;
    const py = clientY - rect.top;
    const oldScale = viewState.scale;
    const newScale = Math.max(0.3, Math.min(2.2, oldScale * factor));
    const ratio = newScale / oldScale;
    viewState.x = px - (px - viewState.x) * ratio;
    viewState.y = py - (py - viewState.y) * ratio;
    viewState.scale = newScale;
    applyTransform();
  }

  canvasView.addEventListener('wheel', (e) => {
    if (e.target.closest('.drawer')) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    zoomAt(factor, e.clientX, e.clientY);
  }, { passive: false });

  // Controls
  document.getElementById('btn-zoom-in').onclick = () => {
    const r = canvasView.getBoundingClientRect();
    zoomAt(1.18, r.left + r.width / 2, r.top + r.height / 2);
  };
  document.getElementById('btn-zoom-out').onclick = () => {
    const r = canvasView.getBoundingClientRect();
    zoomAt(0.84, r.left + r.width / 2, r.top + r.height / 2);
  };
  document.getElementById('btn-fit').onclick = () => fitToView();

  document.getElementById('btn-standard').onclick = () => {
    collapsed.clear();
    nodeById.forEach((n) => {
      if (n._depth >= 2 && n.children && n.children.length) collapsed.add(n.id);
    });
    renderMap();
    fitToView();
  };

  document.getElementById('btn-expand-all').onclick = () => {
    collapsed.clear();
    renderMap();
    fitToView(null, 0.95);
  };

  document.getElementById('btn-collapse').onclick = () => {
    collapsed.clear();
    nodeById.forEach((n) => {
      if (n._depth >= 1 && n.children && n.children.length) collapsed.add(n.id);
    });
    renderMap();
    fitToView();
  };

  drawerClose.onclick = () => {
    drawer.classList.remove('open');
    selectedId = null;
    renderMap();
  };

  tabMap.onclick = () => switchView('map');
  tabOutline.onclick = () => switchView('outline');

  const fullBtn = document.getElementById('btn-full');
  if (!document.documentElement.requestFullscreen) fullBtn.hidden = true;
  fullBtn.onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) {}
  };
  document.addEventListener('fullscreenchange', () => {
    fullBtn.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
    setTimeout(() => fitToView(), 120);
  });

  // Search: auto-expand matching branches
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    searchClear.classList.toggle('show', searchQuery.length > 0);
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      nodeById.forEach((n) => {
        if (matchesSearch(n, q)) {
          let p = parentById.get(n.id);
          while (p) {
            collapsed.delete(p.id);
            p = parentById.get(p.id);
          }
        }
      });
    }
    renderMap();
    if (q) {
      const hitRects = [];
      nodeRects.forEach((r, id) => {
        if (matchesSearch(nodeById.get(id), q)) hitRects.push(r);
      });
      if (hitRects.length) fitToView(hitRects, 1.05);
    }
  });
  searchClear.onclick = () => {
    searchInput.value = '';
    searchQuery = '';
    searchClear.classList.remove('show');
    renderMap();
    fitToView();
  };

  window.addEventListener('resize', () => {
    if (!outlineView.classList.contains('show')) fitToView();
  });

  // Init
  buildJumpPills();
  renderOutline();
  renderMap();
  requestAnimationFrame(() => fitToView());
})();
</script>
</body>
</html>
